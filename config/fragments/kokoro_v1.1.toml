# Text-to-speech: Kokoro v1.1 (Chinese + English, 103 voices), served by this
# project's kokoro_server.py on the CPU: misaki's phonemes on sherpa-onnx's
# ONNX packaging of the model (0.36 GB download; model.onnx 0.33 GB, fp32 on
# purpose: the int8 model is about half as fast). Its Python packages (see
# [api_servers.kokoro] in config/defaults.toml) are installed into
# api_servers/kokoro/lib by install_api_servers.py.

[api_servers.kokoro]
start = true
script = "src/kokoro_server.py"
host = "127.0.0.1"
port = 8083
# {server_dir}: the install folder. --threads: CPU threads (0 lets ONNX Runtime choose automatically).
args = ["--lib", "{server_dir}/lib", "--threads", "0"]

[models.kokoro]
# The archive is unpacked into models/kokoro/; the file after # is passed.
kokoro = "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/kokoro-multi-lang-v1_1.tar.bz2#kokoro-multi-lang-v1_1/model.onnx"

[tts]
# The dashboard speaks through this server (its voices: see [tts] and
# [api_servers.kokoro] in config/defaults.toml).
server = "kokoro"
