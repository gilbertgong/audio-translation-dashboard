# Audio Translation Dashboard: default settings.
#
# Don't edit this file. Put the settings you want to change in config_local.toml
# in the project folder (create it if needed), under the same [section] headers;
# they override the values here, and anything you leave out keeps its default.
# For example:
#
#   [languages]
#   language2 = "Japanese"
#
# Layers, each on top of the one before (see configuration.py): this file, then
# config_generated.toml (from the launcher's Generate config: a recipe's
# servers and models), then config_local.toml, which always wins.
#
# Settings are read at startup; changes take effect on restart. Relative paths
# are relative to the project folder.

[server]
# Keep host on 127.0.0.1/localhost: browsers only allow microphone access on
# localhost or HTTPS pages.
host = "127.0.0.1"
port = 8080

[launcher]
# launcher.pyw: show the developer controls: "Mock", which runs the dashboard
# alone with sample data (app.py --mock) for working on the page without the
# servers; and "Restart app", which restarts just the dashboard to pick up
# changes to it, keeping the servers running.
show_dev_controls = false

[audio]
# Where recorded WAV files are written.
temp_dir = "tmp/audio"
# Recordings are saved as mono 16-bit PCM WAV at this rate (whisper.cpp expects 16000).
sample_rate = 16000
# Uploads larger than this are rejected.
max_upload_mb = 50
# The browser's own microphone processing (applied before the page sees the
# audio). Automatic gain control is off by default: it can change the level
# mid-recording (including the Windows microphone level), especially just
# after the microphone opens. With it off, set the microphone level in Windows
# sound settings and fine-tune with the page's Gain slider.
auto_gain_control = false
# Noise suppression can make speech sound "underwater" on some built-in mics;
# whisper copes with ordinary background noise on its own. Try both.
noise_suppression = true
# Only needed if speakers play while recording.
echo_cancellation = true

[auto_split]
# Automatic splitting on pauses, switched on/off on the page ("Continuous Audio
# Mode"). When on, one Start/Stop keeps the microphone open and each phrase
# is sent as its own recording when you pause. "Speech" is anything clearly
# louder than the background noise, which is measured continuously.
# Whether the switch starts out on when the page loads.
enabled = true
# Silence (ms) that ends a phrase and sends it to be transcribed: short, so
# text appears when the speaker takes a breath. (Speaking translations waits
# for a longer pause: [tts] turn_pause_ms.)
split_pause_ms = 120
# How far (dB) above the background noise counts as speech. Raise it if noise
# triggers phrases; lower it if quiet speech is missed.
threshold_db = 12
# Nothing quieter than this (dBFS) is ever treated as speech.
min_threshold_db = -50
# Audio (ms) kept from just before speech is detected, so first syllables
# aren't cut off.
pre_roll_ms = 300
# Silence (ms) kept at the end of each phrase.
tail_ms = 200
# Phrases with less speech than this (ms) are dropped (coughs, clicks).
min_speech_ms = 300
# Longest phrase (seconds); longer speech is cut here (whisper works on
# 30-second windows).
max_phrase_s = 25

[languages]
# The two languages to translate between, in either direction. Rows the page
# shows in language2 are right-aligned.
language1 = "English"
language2 = "Chinese"

[llama_prompt]
# System prompt sent to llama-server. {language1} and {language2} are replaced
# with the values in [languages]. (A "\" at the end of a line joins it to the
# next one.) The language tag at the end of each translation, e.g. [chinese],
# is a second opinion on the transcript's language: the page hides it, and a
# language other than the two makes it recheck the transcription.
system = """\
You are an expert {language1}-{language2} translator. Your sole purpose is to \
translate the user's text accurately, naturally, and contextually. If the user \
types {language1}, respond only with the {language2} translation. If the user \
types {language2}, respond only with the {language1} translation. Do not \
include introductory phrases, conversational fluff, or explanations unless \
explicitly asked.

Once you complete the translation, add a language tag at the end, indicating \
the language or languages of the user's text. For example [chinese]"""
# Sampling temperature: lower gives more literal, consistent translations.
temperature = 0.2
# Let the model think before answering. Thinking models (like the default
# Qwen) do this unless told not to; it is several times slower per request.
enable_thinking = false

[tts]
# Which [api_servers] section speaks translations: "kokoro" (default) or
# "qwentts". To switch, set start = true on the other one and start = false on
# this one (a TTS fragment does all of that).
server = "kokoro"
# The voice: each server has its own defaults (default_voice, and a voice per
# language in language_voices, in its [api_servers] section), so switching
# servers never leaves another's voice names behind. A translation is spoken
# in the first of these that's set:
#   1. voice_language1 / voice_language2 here, for translations in language1
#      or language2 of [languages]: for anything unusual (a language whisper
#      doesn't know, a voice just for this machine);
#   2. the server's language_voices, by the language's name;
#   3. voice here: one voice for everything, overriding the server's default;
#   4. the server's default_voice.
# Kokoro's voices: af_maple, af_sol, bf_vale (American/British English
# female), zf_001 ... zf_099 (Chinese female), zm_009 ... zm_100 (Chinese
# male); the full list: GET /v1/audio/voices on the server. Qwen3-TTS: a name
# from its voices table ([api_servers.qwentts.voices]), e.g. "beth_thomas".
# voice = ""
# voice_language1 = ""
# voice_language2 = ""
# Whether the page's "Automatic Translation Playback" switch starts out on:
# each translation is spoken, in order, once the speaker has finished.
auto_play = false
# Automatic playback waits until every running source (microphone, capture)
# has been quiet this long (ms): the end of the speaker's turn, longer than a
# phrase's split_pause_ms. If someone starts speaking during playback, it stops
# and that translation is spoken again at the next turn's end. (The ▶ buttons
# play at once.)
turn_pause_ms = 1500
# At most this many translations wait to be spoken; beyond that the oldest is
# dropped (its row says so; its ▶ still works). A speaker who never pauses for
# turn_pause_ms is never talked over, so nothing is spoken until they do.
max_backlog = 3
# Speech starts playing once this much audio (ms) has arrived from the TTS
# server, or all of it if it's shorter, so a slow start doesn't stutter.
# Applies to automatic playback, the ▶ buttons and the test page.
playback_buffer_ms = 800

[models]
# Used by src/download_models.py. Each server's models are in its own
# table below, [models.<name>] for [api_servers.<name>], and saved to
# dir/<name>/. Keys are the server's flag names (model -> --model, kokoro ->
# --kokoro); only the started servers' models are downloaded.
# The whisper and llama models below are sized for 24GB of VRAM.
dir = "models"

[models.whisper]
# A whisper.cpp model name, e.g. "large-v3", "large-v3-turbo", "medium"
# (from huggingface.co/ggerganov/whisper.cpp), or a full URL to a ggml .bin file.
# whisper models listed here: https://github.com/ggml-org/whisper.cpp/blob/master/models/README.md#available-models
model = "large-v3"

[models.llama]
# Full URL to a GGUF model file for llama.
# Qwen is well suited to English-Chinese translation
model = "https://huggingface.co/unsloth/Qwen3.8-27B-GGUF/resolve/main/Qwen3.8-27B-UD-IQ3_XXS.gguf?download=true"

# Suggestions for other VRAM amounts
# both models run at once, so their sizes add up, and additional VRAM is needed for context/etc
#
# 8GB (about 6.4GB for models - 1.1GB and 5.05GB for whisper/llama):
# [models.whisper]
# model = "large-v3-q5_0"
# [models.llama]
# model = "https://huggingface.co/unsloth/Qwen3.5-9B-GGUF/resolve/main/Qwen3.5-9B-UD-Q3_K_XL.gguf?download=true"
#
# 6GB (about 4.8GB for models = .546GB/4.02GB for whisper/llama):
# [models.whisper]
# model = "large-v3-turbo-q5_0"
# [models.llama]
# model = "https://huggingface.co/unsloth/Qwen3.5-9B-GGUF/resolve/main/Qwen3.5-9B-UD-IQ3_XXS.gguf?download=true"

# Text-to-speech, one table per engine in [api_servers].
#
# Kokoro v1.1 (Chinese + English, 82M parameters): runs on the CPU with no GPU
# memory, about 3x real time on one thread. The archive is unpacked into
# models/kokoro/ and the file after # is passed. Use this fp32 model, not the
# int8 one: int8 is smaller but about half as fast (see sherpa_server_win.py).
[models.kokoro]
kokoro = "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/kokoro-multi-lang-v1_1.tar.bz2#kokoro-multi-lang-v1_1/model.onnx"

# Qwen3-TTS 1.7B "base" talker, which speaks in cloned voices (see voices/beth_thomas/),
# about 4GB of GPU memory. Two files: the talker and its codec, passed to
# tts-server as --model and --codec. Smaller: qwen-talker-0.6b-base-Q8_0.gguf
# (about 3GB). Preset voices (serena, vivian, ryan, ...) instead of cloning: a
# "customvoice" talker.
[models.qwentts]
model = "https://huggingface.co/Serveurperso/Qwen3-TTS-GGUF/resolve/main/qwen-talker-1.7b-base-Q8_0.gguf"
codec = "https://huggingface.co/Serveurperso/Qwen3-TTS-GGUF/resolve/main/qwen-tokenizer-12hz-Q8_0.gguf"

[gpu]
# Which NVIDIA GPU(s) the servers may use, by nvidia-smi's index (e.g. "1", or
# "0,1"): src/run_servers.py starts each server with CUDA_VISIBLE_DEVICES set
# to it (and CUDA_DEVICE_ORDER=PCI_BUS_ID, so CUDA numbers the cards as
# nvidia-smi does). "-1" hides them all. Unset: every GPU (llama-server then
# spreads its model across all of them). Generate config sets it to the card
# it sized the recipe for. A server can override it with its own gpu = "...",
# and set other variables in an env table, e.g. [api_servers.qwentts.env];
# CUDA_VISIBLE_DEVICES doesn't apply to Vulkan builds such as qwentts's, which
# take GGML_VK_VISIBLE_DEVICES (in Vulkan's own device order).
# devices = "0"

[api_servers]
# Used by src/install_api_servers.py and src/run_servers.py. Prebuilt
# binaries are downloaded from GitHub releases into install_dir/<name>/.
install_dir = "api_servers"
# Which build to download. Substituted for {binary_type} in the asset patterns
# below. Examples: "win-cuda-12.*-x64" (NVIDIA, CUDA 12), "win-cuda-13.*-x64",
# "win-vulkan-x64". Non-CUDA builds also need the cudart entry removed below.
binary_type = "win-cuda-12.*-x64"

[api_servers.whisper]
# false: don't install or start this server, or download its model (the app
# still uses host and port below; using an instance you already run is planned).
start = true
repo = "ggml-org/whisper.cpp"
# "latest" = newest release (including b#### pre-release builds) that has files
# matching every pattern in assets. Or pin a tag, e.g. "b5454".
release = "latest"
# false: keep whatever build is installed (no network access); download only
# if none is. true: on every run, make sure the release above is installed
# (the newest for "latest", or exactly the pinned tag).
ensure_version = false
# Release file names to download and unzip (* and ? wildcards allowed).
assets = ["whisper-bin-{binary_type}.zip"]
# How src/run_servers.py runs it: the model (from [models.whisper]),
# --host and --port are added automatically; args are any extra options.
executable = "whisper-server"
host = "127.0.0.1"
port = 8081
args = ["--language", "auto"]

# Text-to-speech engines: one is started and used, chosen by [tts] server.
# They start before llama because llama-server sizes itself to the GPU memory
# left over (servers start in the order listed here).

[api_servers.kokoro]
# Kokoro (default), served by this project's kokoro_server.py on the CPU:
# misaki's phonemes (the front end Kokoro was trained with) on the Kokoro ONNX
# model, through onnxruntime. Run with the same Python; its packages, below,
# are installed by install_api_servers.py with pip install --target into the
# install folder's lib/ ({server_dir} in args), not into a virtual
# environment. --threads: CPU threads.
start = true
script = "src/kokoro_server.py"
packages = [
    "misaki==0.9.4",
    # misaki's English (without spacy-curated-transformers, which brings all
    # of PyTorch for a transformer model Kokoro doesn't use), Chinese and
    # Japanese parts (Japanese without pyopenjtalk: kokoro_server.py stands in
    # for it, as only misaki's non-default Japanese G2P uses it)
    "spacy==3.8.16",
    "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "num2words==0.5.14",
    "phonemizer-fork==3.3.2",
    "espeakng-loader==0.2.4",
    "jieba==0.42.1",
    "pypinyin==0.55.0",
    "pypinyin-dict==0.9.0",
    "cn2an==0.5.24",
    "ordered-set==4.1.0",
    "fugashi==1.5.2",
    "unidic-lite==1.0.8",
    "jaconv==0.5.0",
    "mojimoji==0.0.13",
    "onnxruntime==1.31.0",
    "numpy==2.5.4",
]
host = "127.0.0.1"
port = 8083
args = ["--lib", "{server_dir}/lib", "--threads", "4"]
# The voice used unless a better one is set (see [tts]): Beth, a voicepack
# (below) that speaks both languages well.
default_voice = "beth_thomas"
# The voicepacks below are loaded at start, as --voice NAME=FILE.
voice_arg = "--voice"

[api_servers.kokoro.language_voices]
# A voice per language, by whisper's language name: used for translations
# spoken in that language (see [tts] above). Beth for all three; the stock
# voices speak only their own language well (native alternatives: english =
# "af_maple", chinese = "zf_001"; none for Japanese, which v1.1-zh wasn't
# trained on, though Beth speaks it well).
english = "beth_thomas"
chinese = "beth_thomas"
japanese = "beth_thomas"

[api_servers.kokoro.voices]
# Extra voicepacks for this Kokoro model (v1.1-zh): name = a [510, 1, 256]
# voicepack (.pt, or raw float32 .bin), relative to the project folder, then
# selected by name like a stock voice. See voices/beth_thomas/RC3/README.md.
beth_thomas = "voices/beth_thomas/RC3/beth_thomas_rc3.pt"

[api_servers.qwentts]
# Qwen3-TTS, an alternative (off by default): tts-server from qwentts.cpp, with
# voice cloning, on the GPU, as built by the public release workflow in the
# Zyeine fork. The Vulkan build is small and runs on most GPUs without a CUDA
# runtime. Tested with the voice "beth_thomas"; see [tts] for switching.
start = false
repo = "Zyeine/qwentts.cpp"
release = "mellon-v0.1.0"
ensure_version = false
assets = ["mellon-voice-engine-windows-vulkan.zip"]
executable = "tts-server"
host = "127.0.0.1"
port = 8085
# Language detected per text (it is set for the whole server in this build).
args = ["--lang", "auto"]
# The voice used unless a better one is set (see [tts]); from the table below.
default_voice = "beth_thomas"

[api_servers.qwentts.voices]
# Cloned voices, registered by src/run_servers.py every time tts-server
# starts (it keeps them in memory only), then selected by name when speaking.
# name = WAV file of one speaker, about 10-30 s (relative to the project
# folder); no transcript needed. See voices/beth_thomas/README.md.
beth_thomas = "voices/beth_thomas/beth_thomas.wav"

[api_servers.llama]
# start, release and ensure_version: as for whisper above.
start = true
repo = "ggml-org/llama.cpp"
release = "latest"
ensure_version = false
# The cudart zip holds the CUDA runtime DLLs that the CUDA build needs.
assets = ["llama-*-bin-{binary_type}.zip", "cudart-llama-bin-{binary_type}.zip"]
executable = "llama-server"
host = "127.0.0.1"
port = 8082
# llama-server puts all layers on the GPU and fits memory use automatically by
# default; --ctx-size caps the context (the model's default is 262144 tokens).
args = ["--ctx-size", "8192"]
