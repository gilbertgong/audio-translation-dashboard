<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Audio Translation Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Audio Translation Dashboard</h1>
  </header>

  <main>
    <!-- One grid: each recording is a row with its text on the left and its
         activity (timings, details) on the right, so the two always align. -->
    <section id="translation-window" aria-live="polite">
      <div class="col-head conversation-head">Conversation</div>
      <div class="col-head activity-head">
        <span class="col-title">Activity</span>
        <!-- Sidebar toggle: window outline, panel on the right, chevron that
             points right to collapse and left (flipped by CSS) to expand. -->
        <button id="activity-toggle" type="button" aria-expanded="true"
                aria-label="Hide activity" title="Hide activity">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"
               fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="16" rx="2.5"/>
            <line x1="15" y1="4" x2="15" y2="20"/>
            <polyline class="chevron" points="17 9.5 19.5 12 17 14.5"/>
          </svg>
        </button>
      </div>
      <p class="placeholder">Translations will appear here.</p>
    </section>

    <!-- Two-row grid. Top row: hints/indicators, each above the control it
         belongs to (the Space hint above the button, the status above the
         level). Bottom row: button, mode switch, gain, level. -->
    <div class="controls">
      <span class="shortcut-hint"><kbd>Space</kbd> to start/stop</span>
      <span id="status">Idle</span>

      <button id="record-btn" type="button" title="Start/stop recording (Space)">Start Recording</button>
      <!-- "Continuous Audio Mode" in the UI; called auto-split in the code and config. -->
      <label class="switch" title="On: keep listening and send each phrase when you pause. Off: one recording per Start/Stop.">
        <input type="checkbox" id="auto-split" role="switch">
        <span class="switch-track"></span>
        Continuous Audio Mode
      </label>
      <label class="switch" title="On: speak each translation as soon as it's done. Off: use the ▶ button after a translation.">
        <input type="checkbox" id="auto-play" role="switch">
        <span class="switch-track"></span>
        Automatic Translation Playback
      </label>
      <!-- Software gain applied before the meter and the recording. Fine
           adjustment only: set the main level in Windows sound settings. -->
      <label class="gain" title="Software gain (double-click to reset to 0 dB). For larger changes, adjust the microphone level in Windows sound settings.">
        Gain
        <span class="gain-slider">
          <input type="range" id="gain" min="-12" max="6" step="1" value="0" list="gain-ticks">
          <!-- Scale labels, positioned along the thumb's travel (0 dB is at 2/3). -->
          <span class="gain-scale" aria-hidden="true">
            <span style="left: 0%">&minus;12</span>
            <span class="zero" style="left: 66.667%">0</span>
            <span style="left: 100%">+6</span>
          </span>
        </span>
        <span id="gain-value" class="gain-value">0 dB</span>
        <datalist id="gain-ticks">
          <option value="-12"></option>
          <option value="-9"></option>
          <option value="-6"></option>
          <option value="-3"></option>
          <option value="0"></option>
          <option value="3"></option>
          <option value="6"></option>
        </datalist>
      </label>
      <!-- Microphone level while recording: the meter bar (-60 dB left to
           0 dB right) and its dB readout, as one item. -->
      <div class="level">
        <div id="level-meter" class="meter" role="meter" aria-label="Microphone level"
             aria-valuemin="-60" aria-valuemax="0" aria-valuenow="-60"
             title="Microphone level: gray = too quiet, green = good, amber = very loud, red = clipping. The marker shows this recording's highest peak.">
          <div class="meter-fill"></div>
          <div class="meter-peak"></div>
          <div class="meter-threshold" title="Speech threshold (Continuous Audio Mode)"></div>
        </div>
        <span id="level-db" class="meter-db">-∞ dB</span>
      </div>
    </div>
  </main>

  <!-- Viewer for a row's raw whisper/llama exchange (request + response JSON). -->
  <dialog id="raw-dialog" aria-labelledby="raw-title">
    <div class="raw-head">
      <h2 id="raw-title"></h2>
      <button id="raw-copy" type="button">Copy</button>
      <button id="raw-close" type="button" aria-label="Close" title="Close (Esc)">&#x2715;</button>
    </div>
    <pre id="raw-body"></pre>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
